[server]
enableStaticServing = true
headless = true
address = "localhost"          # local only

[browser]
gatherUsageStats = false        # no telemetry

[theme]
base = "light"
primaryColor = "#086F82"
backgroundColor = "#F5F8FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#152238"

[client]
toolbarMode = "viewer"          # hide Deploy / developer menu
